name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # 包含进程崩溃测试：子进程在提交的各个步骤 SIGKILL 自己，父进程重开文件检查
      - run: go test ./...
      - run: go test -race -short ./pager ./btree
